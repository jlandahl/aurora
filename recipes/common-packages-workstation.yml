modules:
  - type: dnf
    repos:
      copr:
        - atim/starship
      files:
        - https://repo.vivaldi.com/stable/vivaldi-fedora.repo
        - nordvpn.repo
    install:
      packages:
        - emacs
        - emacsclient
        - vim
        - vivaldi-stable
        - nordvpn-gui
        - bitwarden-latest.rpm
        - starship
        - https://mega.nz/linux/repo/Fedora_44/x86_64/megasync-Fedora_44.x86_64.rpm
        - https://mega.nz/linux/repo/Fedora_44/x86_64/dolphin-megasync-Fedora_44.x86_64.rpm
    remove:
      packages:
        # example: removing firefox (in favor of the flatpak)
        # "firefox" is the main package, "firefox-langpacks" is a dependency
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)
