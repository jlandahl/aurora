modules:
  - type: dnf
    repos:
      copr:
        - atim/starship
        # - fuddlesworth/PlasmaZones
      files:
        - https://repo.vivaldi.com/stable/vivaldi-fedora.repo
        - nordvpn.repo
    install:
      packages:
        - emacs
        - emacsclient
        - vim
        - vivaldi-stable
        - nordvpn-gui
        - bitwarden-latest.rpm
        - starship
        # - plasmazones
        - https://github.com/phosphor-works/PlasmaZones/releases/download/v3.5.5-r2/plasmazones-3.5.5-2.fc45.x86_64.rpm
    remove:
      packages:
        # example: removing firefox (in favor of the flatpak)
        # "firefox" is the main package, "firefox-langpacks" is a dependency
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)
